# Housekeeparr configuration (schema version 1).
#
# Copy to housekeeparr.toml and adjust. Credentials are never written here:
# use secret references of the form "env:NAME" or "file:/absolute/path".
version = 1

# "observe" (default) reads and evaluates but never writes to managers or
# clients. "paused" keeps visibility and stops new automation. "automatic"
# permits automation ONLY for workflows that are separately enabled AND whose
# hard safety prerequisites hold (including a recorded, tested write workflow
# for the exact application versions). This build does not dispatch automatic
# actions yet; manual actions (`housekeeparr act <id> --confirm`) need
# "paused" or "automatic" and are tested only for no-progress recovery with
# Sonarr 4.0.20 / Radarr 6.4.4 and qBittorrent 5.3.0.
mode = "observe"

[automation]
# Global kill switch: when true, no workflow automation is permitted regardless
# of mode, rules, or overrides.
emergency_stop = false

[automation.workflows]
# Every workflow defaults to false; enabling one never enables another.
no_progress_recovery = false
metadata_recovery = false
preserved_data_failure = false
partial_pack = false
missing_search = false

[automation.limits]
# Bounds on actions that start an acquisition (manual and automatic alike).
# None can be disabled. The values below are implementation proposals, not
# validated product defaults; adjust them to your installation.
#
# Pacing spreads eligible work over time across the installation: when it is
# used up, findings stay open and become eligible again as older actions
# leave the rolling window. It says nothing about any one item.
# acquisitions = 20              # all managers, per window
# manager_acquisitions = 20      # each manager connection, per window
# acquisition_window = "24h"     # rolling; at most 168h and retention.audit_events
#
# Content attempts stop repeated ineffective replacement of one episode or
# movie. They do not return with time: after this many recovery attempts the
# finding needs review, then `housekeeparr attempts reset <manager>|episode:<id>
# --note "..."` allows more. Exhaustion never means no other release exists.
# content_attempts = 3
#
# After a verified recovery, the transfer and its content are not acted on
# again for this long.
# success_cooldown = "24h"
#
# Recovery stops a transfer and keeps it, with its data, in the client. At
# these ceilings recovery stops until retained transfers are removed in the
# client (`housekeeparr retained` lists them). Sizes are logical estimates;
# free space is not measured.
# retained_transfers = 25
# retained_gib = 0               # 0: no byte ceiling

[state]
# Small writable directory for the embedded database and lock file.
# Relative paths resolve against this file's directory. Avoid network
# filesystems (NFS/SMB) for state.
dir = "state"

[web]
# The interface is optional. It binds to loopback only in this milestone;
# use an SSH tunnel or a local reverse proxy for remote viewing.
enabled = true
listen = "127.0.0.1:8484"

[polling]
interval = "10m"         # transfer sampling interval (proposed default)
request_timeout = "30s"
max_concurrency = 4      # connections polled in parallel
jitter = "30s"           # random delay added to each cycle start

[retention]
observations = "168h"                 # detailed transfer observations
max_observations_per_transfer = 1000
connection_checks = "168h"
resolved_findings = "2160h"           # unresolved findings are never pruned
audit_events = "4320h"

[log]
level = "info"   # debug, info, warn, error
format = "text"  # text, json

# Global diagnosis settings. Every value shown is the built-in proposed
# default; omit a key to inherit it. See docs/SPEC.md section 5.1.
[policy]
# new_download_grace = "30m"   # measured from the client's added time when known, else first observation
# no_progress_window = "90m"   # qualifying observation time required, counted after grace
# near_complete_ratio = 0.95
# near_complete_window = "4h"  # replaces no_progress_window at or above near_complete_ratio
# min_observations = 3
# max_observation_gap = "20m"  # defaults to 2 × polling interval; larger gaps restart qualification
# metadata_timeout = "60m"
# import_settle = "30m"
# min_progress_bytes = 1       # verified-byte increase that counts as progress

[[sonarr]]
id = "sonarr"
name = "Sonarr"
url = "http://127.0.0.1:8989"          # include any reverse-proxy base path
api_key = "env:HOUSEKEEPARR_SONARR_API_KEY"
# Map download client names as configured *inside Sonarr* to Housekeeparr
# client connection ids. Without a mapping, correlation uses infohash only.
download_clients = { "qBittorrent" = "qbittorrent" }
# queue_page_size = 200
# max_queue_pages = 25

# Radarr uses the same settings as Sonarr.
# [[radarr]]
# id = "radarr"
# name = "Radarr"
# url = "http://127.0.0.1:7878"
# api_key = "env:HOUSEKEEPARR_RADARR_API_KEY"
# download_clients = { "qBittorrent" = "qbittorrent" }

[[qbittorrent]]
id = "qbittorrent"
name = "qBittorrent"
url = "http://127.0.0.1:8080"
username = "admin"
password = "file:/run/secrets/qbittorrent_password"
# ca_file = "/etc/ssl/private-ca.pem"   # extra CA; TLS verification is never disabled
# allow_insecure_http = false           # required for plain HTTP to non-local hosts

# Connection-scoped overrides take precedence over [policy].
# [qbittorrent.policy]
# no_progress_window = "3h"

# Scoped rules apply after connection policies, in ascending priority order
# (higher priority number wins). At least one match field is required; category
# requires client.
# [[rule]]
# name = "slow-private"
# priority = 10
# [rule.match]
# client = "qbittorrent"
# privacy = "private"
# [rule.policy]
# no_progress_window = "6h"
# [rule.automation]
# no_progress_recovery = false

# Item-level overrides apply after all matching rules. Set either transfer
# ("<client-id>|<native-id>") or content ("<manager-id>|episode:<id>" or
# "<manager-id>|movie:<id>", using the manager's episode or movie ID as shown
# on the finding page), plus a required reason. A content override or
# exclusion follows the episode or movie across replacement releases.
# [[override]]
# transfer = "qbittorrent|0123456789abcdef0123456789abcdef01234567"
# reason = "rare release, wait longer before failing"
# [override.policy]
# no_progress_window = "24h"
# [override.automation]
# no_progress_recovery = false

# Exclusions make one or more workflows (default: all) ineligible for a scope.
# An exclusion cannot be cancelled by a rule or override.
# [[exclude]]
# client = "qbittorrent"
# category = "keep"
# workflows = ["no_progress_recovery", "metadata_recovery"]
# reason = "manually curated category"

# Transmission (legacy RPC; HTTP basic auth is optional).
# [[transmission]]
# id = "transmission"
# name = "Transmission"
# url = "http://127.0.0.1:9091"
# rpc_path = "/transmission/rpc"
# username = "admin"
# password = "file:/run/secrets/transmission_password"

# Deluge through the deluge-web JSON API. deluge-web must already be
# connected to the daemon; only the web password is used.
# [[deluge]]
# id = "deluge"
# url = "http://127.0.0.1:8112"
# password = "file:/run/secrets/deluge_web_password"

# rTorrent through an XML-RPC-over-HTTP gateway (nginx scgi_pass, or
# ruTorrent's /RPC2). Raw SCGI sockets are not supported.
# [[rtorrent]]
# id = "rtorrent"
# url = "https://seedbox.example.com/rutorrent"
# rpc_path = "/RPC2"
# username = "user"
# password = "file:/run/secrets/rtorrent_password"
