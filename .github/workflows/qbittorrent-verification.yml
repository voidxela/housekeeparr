name: qBittorrent release verification

on:
  push:
    branches: [review/remediation]
    paths: [.github/workflows/qbittorrent-verification.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the tested commit
        run: |
          verification_dir=$(mktemp -d /tmp/housekeeparr-verification.XXXXXX)
          printf 'HK_VERIFY_ROOT=%s\n' "$verification_dir" >> "$GITHUB_ENV"
          cd "$verification_dir"
          git init .
          git fetch --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git -c advice.detachedHead=false checkout FETCH_HEAD
      - name: Prepare Go and modules
        run: |
          curl -fsSL --retry 3 https://go.dev/dl/go1.27.4.linux-amd64.tar.gz -o "$HK_VERIFY_ROOT/go.tar.gz"
          printf '%s  %s\n' 7226736c2339719cda28fbf3a54d71aa63bcefe376e98cef00034268dab24840 "$HK_VERIFY_ROOT/go.tar.gz" | sha256sum -c
          tar -xzf "$HK_VERIFY_ROOT/go.tar.gz" -C "$HK_VERIFY_ROOT"
          printf '%s\n' "$HK_VERIFY_ROOT/go/bin" >> "$GITHUB_PATH"
          printf 'GOMODCACHE=%s\nGOCACHE=%s\nHOUSEKEEPARR_IT_CACHE=%s\n' "$HK_VERIFY_ROOT/gomod" "$HK_VERIFY_ROOT/gobuild" "$HK_VERIFY_ROOT/fixtures" >> "$GITHUB_ENV"
      - name: Verify both managers in a loopback-only namespace
        run: |
          cd "$HK_VERIFY_ROOT"
          go mod download
          sudo chown -R root:root "$HK_VERIFY_ROOT"
          sudo --preserve-env=PATH,GOMODCACHE,GOCACHE,HOUSEKEEPARR_IT_CACHE env "PATH=$PATH" scripts/it/run.sh --clients qbittorrent --managers sonarr,radarr --qbt 5.3.0
