name: Released torrent client verification

on:
  push:
    branches: [review/remediation]
    paths: [.github/workflows/qbittorrent-verification.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the tested commit
        run: |
          verification_dir=$(mktemp -d /tmp/housekeeparr-verification.XXXXXX)
          printf 'HK_VERIFY_ROOT=%s\n' "$verification_dir" >> "$GITHUB_ENV"
          cd "$verification_dir"
          git init .
          git fetch --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git -c advice.detachedHead=false checkout FETCH_HEAD
      - name: Prepare Go and empty caches
        id: prepare
        run: |
          curl -fsSL --retry 3 https://go.dev/dl/go1.27.4.linux-amd64.tar.gz -o "$HK_VERIFY_ROOT/go.tar.gz"
          printf '%s  %s\n' 7226736c2339719cda28fbf3a54d71aa63bcefe376e98cef00034268dab24840 "$HK_VERIFY_ROOT/go.tar.gz" | sha256sum -c
          tar -xzf "$HK_VERIFY_ROOT/go.tar.gz" -C "$HK_VERIFY_ROOT"
          printf '%s\n' "$HK_VERIFY_ROOT/go/bin" >> "$GITHUB_PATH"
          printf 'GOMODCACHE=%s\nGOCACHE=%s\nHOUSEKEEPARR_IT_CACHE=%s\n' "$HK_VERIFY_ROOT/gomod" "$HK_VERIFY_ROOT/gobuild" "$HK_VERIFY_ROOT/fixtures" >> "$GITHUB_ENV"
      - name: Verify qBittorrent with both managers
        run: |
          cd "$HK_VERIFY_ROOT"
          python3 -B -m unittest discover -s scripts/it -p test_setup_clients.py
          test ! -e "$GOMODCACHE"
          sudo chown -R root:root "$HK_VERIFY_ROOT"
          sudo --preserve-env=PATH,GOMODCACHE,GOCACHE,HOUSEKEEPARR_IT_CACHE env "PATH=$PATH" scripts/it/run.sh --clients qbittorrent --managers sonarr,radarr --qbt 5.3.0
      - name: Verify Deluge with both managers
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: |
          # The pinned Deluge Python extension uses the Debian 3.13 ABI.
          # The disposable container can create the harness's nested namespaces.
          docker run --rm --privileged \
            --mount "type=bind,src=$HK_VERIFY_ROOT,dst=/verify" \
            --workdir /verify \
            debian:trixie-slim@sha256:7378260c0a098d27ac206225db5e7d92b8c7c84ea7afccc86eeb513756bbd392 \
            bash -euc '
              apt-get update
              apt-get install -y --no-install-recommends ca-certificates curl libicu76 procps python3 util-linux xz-utils
              export PATH="/verify/go/bin:$PATH"
              export GOMODCACHE=/verify/gomod GOCACHE=/verify/gobuild HOUSEKEEPARR_IT_CACHE=/verify/fixtures
              python3 --version
              go version
              scripts/it/run.sh --clients deluge --manager-client deluge --managers sonarr,radarr --only "PartialPackWorkflow|ProactiveSearch|PreservedDataFailure"
            '
